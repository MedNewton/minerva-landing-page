* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; position: relative; }

.otp { display: flex; gap: 14px; }

.stack > * + * { margin-top: 22px; }
.fork { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

.tag { display: inline-flex; align-items: center; height: 42px; padding: 0 18px; border-radius: 999px; font-size: 21px; font-weight: 600; background: var(--accent-tint); color: var(--accent-strong); margin-bottom: 22px; }
.tag.green { background: var(--success-tint); color: var(--success); }

.fork p { font-size: 25px; line-height: 1.45; color: var(--fg-muted); }
.result { display: flex; align-items: center; gap: 18px; padding: 18px 20px; border-radius: 16px; background: var(--surface-alt); }
.avatar { width: 56px; height: 56px; border-radius: 12px; background: #DCE7F0; color: var(--accent-strong); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; flex: none; }
.result b { display: block; font-size: 24px; font-weight: 600; }

.notice.wait { background: var(--accent-tint); color: var(--accent-strong); }
.notice.ok { background: var(--success-tint); color: var(--success); }
.dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; flex: none; margin-top: 10px; }
.stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 34px; }
.step { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: var(--fg-subtle); }

.step.done i { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.active { color: var(--fg); }
.step.active i { border-color: var(--fg); background: var(--fg); color: #fff; }
.bar { flex: 1; height: 2px; background: var(--border-strong); min-width: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.drop { border: 2px dashed var(--border-strong); border-radius: 16px; height: 96px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 22px; color: var(--fg-muted); }
.drop.done { border-style: solid; border-color: var(--success); color: var(--success); background: var(--success-tint); }
.meter { height: 16px; border-radius: 16px; background: var(--border); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 16px; }
.big { font-family: var(--mono); font-size: 64px; font-weight: 600; letter-spacing: -0.01em; }
.strike { color: var(--fg-subtle); text-decoration: line-through; text-decoration-thickness: 3px; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.center .lead { max-width: 36ch; margin-left: auto; margin-right: auto; }
.url { margin-top: 34px; font-size: 30px; color: var(--accent); font-weight: 600; }
.tiny { font-size: 22px; color: var(--fg-subtle); margin-top: 16px; }

        <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:22px"><div class="label" style="margin:0">${c.complete}</div><div class="big" style="font-size:44px" data-type="count" data-a="35" data-b="100" data-from="1.2" data-to="3.6">35%</div></div>
        <div class="meter"><i data-type="meter" data-a="35" data-b="100" data-from="1.2" data-to="3.6"></i></div>
      </div>
      <div class="card" data-in="2.2">
        <div class="label">${c.ateco}</div>
        <div class="row" style="align-items:center;gap:28px;margin:10px 0 6px"><span class="big strike">62.01.00</span><span style="font-size:48px;color:var(--accent)">→</span><span class="big" data-in="3.0">620100</span></div>
        <div class="hint">${c.atecoHint}</div>
      </div>
    </div>
  </div>
</section>

<section class="scene" data-scene="end">
  <div class="center">
    <img src="../../public/assets/logo-light.svg" alt="" data-in="0.1" style="width:96px;height:96px;border-radius:22px;margin-bottom:36px" />
    <h1 data-in="0.3">${c.endH}</h1>
    <p class="lead" data-in="0.7">${c.endP}</p>
    <div class="url" data-in="1.1">${c.endUrl}</div>
    <div class="tiny" data-in="1.4">${c.endGuide}</div>
  </div>
</section>`;

// ---------- deterministic renderer ----------
const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const FADE = 0.45;

function render(t) {
  document.getElementById('prog').style.width = `${clamp(t / DURATION) * 100}%`;
  for (const s of SCENES) {
    const el = document.querySelector(`[data-scene="${s.id}"]`);
    const local = t - s.start;
    const len = s.end - s.start;
    const vis = clamp(local / 0.35) * (1 - clamp((local - (len - 0.35)) / 0.35));
    el.style.opacity = vis;
    el.style.visibility = vis > 0 ? 'visible' : 'hidden';
    if (vis === 0) continue;

    el.querySelectorAll('[data-in],[data-out]').forEach((n) => {
      const tin = n.dataset.in !== undefined ? +n.dataset.in : -1;
      const tout = n.dataset.out !== undefined ? +n.dataset.out : 1e9;
      const pin = easeOut(clamp((local - tin) / FADE));
      const pout = clamp((local - tout) / 0.3);
      n.style.opacity = pin * (1 - pout);
      n.style.transform = `translateY(${(1 - pin) * 28}px)`;
    });

    el.querySelectorAll('[data-type]').forEach((n) => {
      const d = n.dataset;
      switch (d.type) {
        case 'type': {
          const p = clamp((local - +d.from) / (+d.to - +d.from));
          const k = Math.round(p * d.text.length);
          const typing = local >= +d.from - 0.2 && local <= +d.to + 0.6;
          n.innerHTML = k === 0 && !typing ? '' : d.text.slice(0, k) + (typing ? '<span class="caret"></span>' : '');
          break;
        }
        case 'otp': {
          const p = clamp((local - +d.from) / (+d.to - +d.from));
          const k = Math.round(p * d.text.length);
          [...n.children].forEach((sp, i) => {
            sp.textContent = i < k ? d.text[i] : '';
            sp.style.borderColor = i === k && p < 1 ? 'var(--accent)' : '';
          });
          break;
        }
        case 'toggle':
          n.classList.toggle('on', local >= +d.at);
          n.firstElementChild.style.opacity = local >= +d.at ? 1 : 0;
          break;
        case 'press': {
          const x = local - +d.at;
          const s = x > 0 && x < 0.3 ? 1 - 0.05 * Math.sin((x / 0.3) * Math.PI) : 1;
          const base = d.in !== undefined ? n.style.transform : '';
          n.style.transform = `${base} scale(${s})`;
          break;
        }
        case 'drop': {
          const done = local >= +d.at;
          n.classList.toggle('done', done);
          const txt = n.querySelector('.txt');
          txt.textContent = done ? txt.dataset.done : txt.dataset.empty;
          break;
        }
        case 'stepper': {
          const times = d.times.split(',').map(Number);
          let active = 0;
          times.forEach((tt, i) => { if (local >= tt) active = i; });
          [...n.querySelectorAll('.step')].forEach((st, i) => {
            st.classList.toggle('done', i < active);
            st.classList.toggle('active', i === active);
            st.querySelector('i').innerHTML = i < active ? tick : String(i + 1);
          });
          break;
        }
        case 'meter':
        case 'count': {
          const p = easeOut(clamp((local - +d.from) / (+d.to - +d.from)));
          const v = Math.round(+d.a + (+d.b - +d.a) * p);
          if (d.type === 'meter') n.style.width = `${v}%`;
          else n.textContent = `${v}%`;
          break;
        }
      }
    });
  }
}
window.render = render;
window.DURATION = DURATION;
render(+(new URLSearchParams(location.search).get('t') ?? 0));
</script>
</body>
</html>
